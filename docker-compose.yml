services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: orion_invest
      POSTGRES_USER: orion
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orion -d orion_invest"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    image: ${BACKEND_IMAGE:-orion-invest-backend}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://orion:${POSTGRES_PASSWORD}@db:5432/orion_invest
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    image: ${FRONTEND_IMAGE:-orion-invest-web}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - backend

volumes:
  pgdata:
