name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_REF: hreaxtlivntifwmaacox

jobs:
  # ---------------- CI: Frontend React ----------------
  frontend:
    name: Frontend (React + Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Auditoría de dependencias
        run: npm audit --omit=dev --audit-level=high
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  # ---------------- CI: Edge Function (Deno) ----------------
  function:
    name: Edge Function (Deno)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: supabase/functions/invest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Revisión de tipos
        run: deno check index.ts
      - name: Pruebas de reglas de riesgo
        run: deno test risk_test.ts brain_test.ts

  # ---------------- CI: Búsqueda de secretos ----------------
  secrets-scan:
    name: Escaneo de secretos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 detect --source /repo --config /repo/.gitleaks.toml --redact -v

  # ---------------- CD: Web en GitHub Pages ----------------
  deploy-pages:
    name: Publicar web (GitHub Pages)
    needs: [frontend, function, secrets-scan]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # ---------------- CD: Edge Function en Supabase ----------------
  # Se activa al crear el secreto SUPABASE_ACCESS_TOKEN en GitHub.
  deploy-function:
    name: Desplegar función (Supabase)
    needs: [frontend, function, secrets-scan]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Verificar token
        id: check
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "Sin SUPABASE_ACCESS_TOKEN: se omite el despliegue de la función."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: supabase/setup-cli@v1
        if: steps.check.outputs.enabled == 'true'
        with:
          version: latest
      - name: Desplegar
        if: steps.check.outputs.enabled == 'true'
        run: supabase functions deploy invest --project-ref "$SUPABASE_PROJECT_REF" --use-api
