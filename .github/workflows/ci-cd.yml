name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/orion-nova-technologies-s-a-s/orion-invest

jobs:
  # ---------------- CI: Backend Python ----------------
  backend:
    name: Backend (FastAPI + PostgreSQL)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: orion
          POSTGRES_PASSWORD: orion
          POSTGRES_DB: orion_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U orion -d orion_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://orion:orion@localhost:5432/orion_test
      SECRET_KEY: ci-secret-key-solo-para-pruebas-0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint (ruff, incluye reglas de seguridad)
        run: ruff check .
      - name: Pruebas
        run: pytest -q
      - name: Auditoría de dependencias
        run: pip-audit -r requirements.txt

  # ---------------- CI: Frontend React ----------------
  frontend:
    name: Frontend (React + Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Auditoría de dependencias
        run: npm audit --omit=dev --audit-level=high

  # ---------------- CI: Búsqueda de secretos ----------------
  secrets-scan:
    name: Escaneo de secretos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 detect --source /repo --redact -v

  # ---------------- CD: Imágenes Docker en GitHub Packages ----------------
  publish:
    name: Publicar imágenes Docker
    needs: [backend, frontend, secrets-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: backend
            context: backend
          - name: web
            context: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.name }}:latest
            ${{ env.IMAGE_PREFIX }}-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # ---------------- CD: Despliegue al servidor (opcional) ----------------
  # Se activa cuando configures estos secretos en GitHub:
  # DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY y DEPLOY_PATH
  deploy:
    name: Desplegar en servidor
    needs: publish
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
    steps:
      - name: Verificar configuración
        id: check
        run: |
          if [ -z "$DEPLOY_HOST" ]; then
            echo "Sin DEPLOY_HOST: se omite el despliegue."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Actualizar contenedores por SSH
        if: steps.check.outputs.enabled == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd "${{ secrets.DEPLOY_PATH }}"
            git pull --ff-only
            export BACKEND_IMAGE=${{ env.IMAGE_PREFIX }}-backend:${{ github.sha }}
            export FRONTEND_IMAGE=${{ env.IMAGE_PREFIX }}-web:${{ github.sha }}
            docker compose pull backend web
            docker compose up -d --no-build
            docker image prune -f
